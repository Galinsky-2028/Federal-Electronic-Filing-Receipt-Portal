# Federal Electronic Filing & Receipt Portal: DEMONSTRATION deployment
# (Render free plan). It is not an official U.S. Government service. Demo
# filings use fictional agencies and synthetic data; receipts are signed by a
# prototype key and are never government receipts.
# Secrets are entered in Render only (sync: false) and never committed:
#   DATABASE_URL         Neon Postgres connection string (sslmode=require)
#   RECEIPT_SIGNING_KEY  base64 PKCS#8 DER Ed25519 private key
#   SESSION_SECRET       >= 32 random characters
#   DATA_ENCRYPTION_KEY  64 hex chars (envelope-encryption key-encryption key)
#   METRICS_TOKEN / EVENTS_FEED_TOKEN (optional bearer tokens)
#   STAFF_USERNAME / STAFF_PASSWORD (>= 16 chars) for the demo staff console
# With none of the first three set, demo filing is disabled; with only some
# set, startup aborts. Migrations run on startup under an advisory lock.
services:
  - type: web
    name: federal-filing-receipt-portal-prototype
    runtime: node
    repo: https://github.com/Galinsky-2028/Federal-Electronic-Filing-Receipt-Portal
    branch: main
    region: virginia
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORTAL_BIND_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: PUBLIC_ORIGIN
        value: https://federal-filing-receipt-portal-prototype.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: RECEIPT_SIGNING_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: EVENTS_FEED_TOKEN
        sync: false
      - key: STAFF_USERNAME
        sync: false
      - key: STAFF_PASSWORD
        sync: false
